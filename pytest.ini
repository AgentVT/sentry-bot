[pytest]
# Pytest configuration for SentryBot

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (optional)
# addopts = --cov=. --cov-report=html --cov-report=term

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    hardware: Tests requiring actual hardware (PIR, LED, etc.)
